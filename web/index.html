<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gesture Overlay</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --muted: #8a90a0;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
      display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px;
    }
    .app { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
    h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }

    .left { flex: 1 1 640px; max-width: 720px; min-width: 0; }
    .stage {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
    }
    .stage video, .stage canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
    }
    .start {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
      background: rgba(0, 0, 0, .6);
    }
    .start button {
      font: inherit; font-size: 16px; padding: 14px 28px; border-radius: 999px; border: 0;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .start button:disabled { opacity: .6; cursor: wait; }

    /* 제스처 오버레이 */
    .overlay {
      position: absolute; z-index: 3; pointer-events: none;
      transform: translate(-50%, -50%) scale(.3); opacity: 0;
      transition: opacity .18s ease, transform .25s cubic-bezier(.2, 1.6, .4, 1);
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .5));
    }
    .overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .overlay.emoji { font-size: 160px; line-height: 1; }
    .overlay svg { width: 280px; height: auto; display: block; }

    .panel {
      width: 300px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px;
    }
    .result { font-size: 34px; font-weight: 700; margin: 4px 0 2px; }
    .score { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .bar-row { display: grid; grid-template-columns: 70px 1fr 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
    .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
    .bar-row span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    label.slider { display: block; margin-top: 18px; font-size: 13px; color: var(--muted); }
    label.slider input { width: 100%; }
    .hint { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .error { color: #ff7a7a; }

    @media (max-width: 760px) { .panel { width: 100%; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="left">
      <h1>🖐️ Gesture Overlay</h1>
      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="start" id="start"><button id="startBtn">카메라 시작</button></div>
      </div>
    </div>

    <div class="panel">
      <div class="score">인식 결과</div>
      <div class="result" id="result">-</div>
      <div class="score" id="score">&nbsp;</div>
      <div id="bars"></div>
      <label class="slider">최소 확신도 <b id="thrText">0.70</b>
        <input id="thr" type="range" min="0" max="1" step="0.01" value="0.7" />
      </label>
      <div class="hint" id="hint">
        nike → Nike 로고 · ok → 👌 · 멈춰 → 😡<br />
        제스처가 5프레임 연속 같아야 표시됩니다.
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
